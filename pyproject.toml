[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentboard"
# Read out of the package, not repeated here: a version in two files is a wheel
# that says one thing and a `--version` that says another. Bump `__init__.py` only.
dynamic = ["version"]
description = "A per-repo coordination layer for concurrent coding agents: claim a card and its paths, then work without colliding."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: the table form is deprecated and a future setuptools stops putting
# the licence text in the wheel with it
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent-coordination", "yaml", "task-tracker", "local-first", "git", "multi-agent"]
dependencies = ["ruamel.yaml>=0.18"]

[project.urls]
Homepage = "https://github.com/Allenfp/agentboard"
Repository = "https://github.com/Allenfp/agentboard"
Issues = "https://github.com/Allenfp/agentboard/issues"

[project.scripts]
agentboard = "agentboard.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.setuptools.dynamic]
version = { attr = "agentboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentboard = ["static/*", "skills/*/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Chosen to be clean today, not aspirationally broad: a rule set with 119 open
# findings is a lint run people learn to ignore. Each entry earns its place.
# F821 found `Any` used 29 times in `api.py` and never imported — invisible at
# runtime because `from __future__ import annotations` defers the name, fatal to
# anything that resolves hints. F841 found a validation computed and dropped.
# N802 is included and N818/N801 are not: N802 caught a real typo
# (`...store_is_openeD`), while N818 would rename `ClaimDenied`, `Usage` and
# `Conflict` and N801 would rename `locked`, which is lowercase deliberately as
# a context manager. Those names are the published surface of this package.
select = [
  "E4", "E5", "E7", "E9", "F", # pycodestyle errors (E5 = P16's 100 columns) + pyflakes
  "W291", "W292", "W293",      # P16's "no trailing whitespace, file ends in a newline"
  "I001", "I002",              # P6's import order, including the future-import first
  "UP037",                     # quoted annotations, redundant under P9
  "N802",                      # function-name casing
  "RUF100",                    # stale noqa: the only way a noqa becomes a lie
  "B904",                      # raise ... from inside except: keeps tracebacks useful
  "PLW1510",                   # subprocess.run without an explicit check=
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately run commands that are meant to fail and read the exit code.
"tests/*" = ["PLW1510"]

[tool.coverage.run]
source = ["agentboard"]
branch = true

[tool.coverage.report]
# Measured, not aspirational: 81% with branch coverage on (api.py 70%, server.py
# 95%). The floor sits one point under the measurement so it fails on a drop and
# passes today -- a gate that is red on a good commit is a gate someone clicks
# through, and 88 was exactly that. Re-measure with
# `uv run pytest -q --cov --cov-report=term` and move it up only.
fail_under = 80
skip_covered = true

[tool.pyright]
# `src` is the shipped surface and is clean today; `tests` is not (98 findings
# in the JS harness stubs, docs/UPGRADES.md). A gate that is red on a good
# commit is a gate people learn to click through, so it covers what ships.
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false

