id: PROD-8
title: A blocked_by cycle is refused and names the cycle
desc: |
  `dep add A --blocked-by B` then `dep add B --blocked-by A` used to write happily, and afterwards no two calls could agree on what was ready. The message has to contain both ids, or nobody finds the edge.
