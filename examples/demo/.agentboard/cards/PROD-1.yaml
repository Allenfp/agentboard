id: PROD-1
title: One file per card, so two agents stop rewriting line 1
desc: |
  The old store kept every card in one file and bumped one global `rev` on every write, so two clones touching two unrelated cards still collided - in the app with a 409, and in git because both rewrote the same line. A card is a filename now, so an unrelated card is an unrelated path and git merges it without being asked.
